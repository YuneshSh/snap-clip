<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=400" />
  <title>SnapClip</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <img class="logo-img" src="icons/logo-wordmark.png" alt="SnapClip" />
        <span class="status-dot" id="statusDot" title="Companion: connecting…" aria-label="Companion status"></span>
        <button class="cal-chip" id="calChip" title="Open calendar" aria-label="Open calendar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="4" width="18" height="18" rx="2"/>
            <line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
          </svg>
          <span id="calChipLabel">—</span>
        </button>
      </div>
      <div class="header-right">
        <span class="count-badge" id="countBadge">0 / 10</span>
        <button class="icon-btn" id="pasteBtn" title="Paste screenshot from clipboard" aria-label="Paste from clipboard">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="8" y="2" width="8" height="4" rx="1"/>
            <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>
            <line x1="12" y1="11" x2="12" y2="17"/>
            <line x1="9" y1="14" x2="15" y2="14"/>
          </svg>
        </button>
        <button class="icon-btn" id="settingsBtn" title="Settings" aria-label="Settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Today's reminders ticker -->
    <div class="ticker" id="ticker" hidden>
      <svg class="ticker-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
      </svg>
      <div class="ticker-viewport">
        <div class="ticker-track" id="tickerTrack"></div>
      </div>
    </div>

    <!-- Calendar popover -->
    <div class="cal-popover" id="calPanel" hidden>
      <div class="cal-head">
        <button class="cal-nav" id="calPrev" aria-label="Previous month">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <span class="cal-title" id="calTitle"></span>
        <button class="cal-nav" id="calNext" aria-label="Next month">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
      </div>
      <div class="cal-weekdays">
        <span>Su</span><span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span>
      </div>
      <div class="cal-days" id="calDays"></div>
      <button class="cal-today" id="calToday">Today</button>

      <!-- Selected-date notes / reminders -->
      <div class="cal-notes" id="calNotes">
        <div class="cal-notes-date" id="calNotesDate"></div>
        <div class="cal-notes-list" id="calNotesList"></div>
        <div class="cal-note-add">
          <input type="text" id="calNoteInput" class="cal-note-input" placeholder="Add a note…" maxlength="120" />
          <button class="cal-note-add-btn" id="calNoteAddBtn" aria-label="Add note">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </button>
        </div>
      </div>
    </div>

    <!-- Settings Panel -->
    <div class="settings-panel" id="settingsPanel">
      <div class="settings-inner">
        <h3 class="settings-title">Settings</h3>
        <div class="setting-row">
          <label for="maxInput" class="setting-label">Max saved screenshots</label>
          <div class="setting-control">
            <button class="stepper-btn" id="decrementBtn" aria-label="Decrease">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"/></svg>
            </button>
            <input type="number" id="maxInput" class="max-input" min="1" max="50" value="10" />
            <button class="stepper-btn" id="incrementBtn" aria-label="Increase">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            </button>
          </div>
        </div>
        <div class="setting-row setting-row-col">
          <label class="setting-label">Accent color</label>
          <div class="theme-swatches" id="themeSwatches" role="radiogroup" aria-label="Accent color">
            <button class="swatch" data-theme="ocean"   style="--s1:#38bdf8;--s2:#1683d8" title="Ocean"   aria-label="Ocean"></button>
            <button class="swatch" data-theme="violet"  style="--s1:#a78bfa;--s2:#7c3aed" title="Violet"  aria-label="Violet"></button>
            <button class="swatch" data-theme="fuchsia" style="--s1:#f472b6;--s2:#db2777" title="Fuchsia" aria-label="Fuchsia"></button>
            <button class="swatch" data-theme="mint"    style="--s1:#34d399;--s2:#059669" title="Mint"    aria-label="Mint"></button>
            <button class="swatch" data-theme="sunset"  style="--s1:#fbbf24;--s2:#d97706" title="Sunset"  aria-label="Sunset"></button>
            <button class="swatch" data-theme="coral"   style="--s1:#fb7185;--s2:#e11d48" title="Coral"   aria-label="Coral"></button>
            <button class="swatch" data-theme="indigo"  style="--s1:#818cf8;--s2:#4f46e5" title="Indigo"  aria-label="Indigo"></button>
            <button class="swatch" data-theme="aurora"  style="--s1:#2dd4bf;--s2:#0d9488" title="Aurora"  aria-label="Aurora"></button>
          </div>
        </div>
        <div class="settings-actions">
          <button class="btn btn-secondary btn-sm" id="clearAllBtn">Clear all</button>
          <button class="btn btn-primary btn-sm" id="saveSettingsBtn">Save</button>
        </div>
      </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <!-- Tabs -->
    <nav class="tabs" role="tablist">
      <button class="tab active" id="tabSnaps" role="tab" aria-selected="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <circle cx="12" cy="12" r="3.5"/>
          <path d="M7 3v2M17 3v2"/>
        </svg>
        Snaps
      </button>
      <button class="tab" id="tabTexts" role="tab" aria-selected="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="4" y1="7" x2="20" y2="7"/>
          <line x1="4" y1="12" x2="20" y2="12"/>
          <line x1="4" y1="17" x2="14" y2="17"/>
        </svg>
        Texts
      </button>
      <button class="tab" id="tabLinks" role="tab" aria-selected="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
        </svg>
        Links
      </button>
    </nav>

    <!-- Main content -->
    <main class="main" id="main">
      <!-- Snaps panel -->
      <section class="panel" id="snapsPanel">
        <div class="empty-state" id="emptyState">
          <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
            <circle cx="12" cy="12" r="4"/>
            <path d="M7 3v2M17 3v2M3 7h2M19 7h2"/>
          </svg>
          <p class="empty-title">No screenshots yet</p>
          <p class="empty-sub">Copy a screenshot with any tool, then paste it here.</p>
          <button class="btn btn-primary empty-paste-btn" id="emptyPasteBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="8" y="2" width="8" height="4" rx="1"/>
              <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>
              <line x1="12" y1="11" x2="12" y2="17"/>
              <line x1="9" y1="14" x2="15" y2="14"/>
            </svg>
            Paste from clipboard
          </button>
        </div>
        <div class="grid" id="grid"></div>
      </section>

      <!-- Texts panel -->
      <section class="panel" id="textsPanel" hidden>
        <div class="empty-state" id="emptyStateTexts">
          <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M4 6h16M4 11h16M4 16h10"/>
          </svg>
          <p class="empty-title">No copied text yet</p>
          <p class="empty-sub">Copy any text and it will appear here. Click an entry to copy it again.</p>
        </div>
        <div class="text-list" id="textList"></div>
      </section>

      <!-- Links / Bookmarks panel -->
      <section class="panel" id="linksPanel" hidden>
        <div class="empty-state" id="emptyStateLinks">
          <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
          </svg>
          <p class="empty-title">No links yet</p>
          <p class="empty-sub">Copy any URL and it lands here. Pin the ones you want to keep for good.</p>
        </div>
        <div class="link-list" id="linkList"></div>
      </section>
    </main>

    <!-- Docked, collapsible pinned section (Texts / Links) -->
    <div class="pinned-drawer" id="pinnedDrawer" hidden>
      <button class="pinned-toggle" id="pinnedToggle" aria-expanded="false">
        <svg class="pinned-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="6 9 12 15 18 9"/></svg>
        <svg class="pinned-pin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 17v5M9 10.76V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v6.76a2 2 0 0 0 .55 1.38l1.6 1.68A1 1 0 0 1 17 15.5H7a1 1 0 0 1-.75-1.68l1.6-1.68A2 2 0 0 0 9 10.76z"/>
        </svg>
        <span class="pinned-title" id="pinnedTitle">Pinned</span>
        <span class="pinned-count" id="pinnedCount">0</span>
      </button>
      <div class="pinned-list" id="pinnedList" hidden></div>
    </div>
  </div>

  <!-- Card template -->
  <template id="cardTemplate">
    <div class="card" data-id="">
      <button class="card-img-wrap view-trigger" title="Click to view">
        <img class="card-img" alt="Screenshot" />
        <span class="card-overlay">
          <span class="overlay-hint">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M15 3h6v6M14 10l7-7M9 21H3v-6M10 14l-7 7"/>
            </svg>
            View
          </span>
        </span>
      </button>
      <div class="card-footer">
        <button class="card-time view-trigger" title="View screenshot">
          <svg class="time-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
          <span class="time-text"></span>
        </button>
        <div class="card-actions">
          <button class="action-btn copy-btn" title="Copy to clipboard">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="9" y="9" width="13" height="13" rx="2"/>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
            </svg>
          </button>
          <button class="action-btn save-btn" title="Download image">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="7 10 12 15 17 10"/>
              <line x1="12" y1="15" x2="12" y2="3"/>
            </svg>
          </button>
          <button class="action-btn delete-btn" title="Delete">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="3 6 5 6 21 6"/>
              <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
              <path d="M10 11v6M14 11v6"/>
              <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </template>

  <!-- Text item template -->
  <template id="textCardTemplate">
    <div class="text-item" data-id="">
      <button class="text-body" title="Click to copy">
        <p class="text-content"></p>
        <span class="text-copy-hint">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="9" y="9" width="13" height="13" rx="2"/>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
          </svg>
          Copy
        </span>
      </button>
      <div class="text-footer">
        <span class="text-time"></span>
        <div class="text-actions">
          <button class="action-btn text-pin-btn" title="Pin">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 17v5M9 10.76V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v6.76a2 2 0 0 0 .55 1.38l1.6 1.68A1 1 0 0 1 17 15.5H7a1 1 0 0 1-.75-1.68l1.6-1.68A2 2 0 0 0 9 10.76z"/>
            </svg>
          </button>
          <button class="action-btn text-delete-btn" title="Delete">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="3 6 5 6 21 6"/>
              <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
              <path d="M10 11v6M14 11v6"/>
              <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </template>

  <!-- Compact pinned text row (drawer) -->
  <template id="pinnedTextTemplate">
    <div class="pinned-text-item" data-id="">
      <button class="pinned-text-copy" type="button" title="Click to copy">
        <p class="pinned-text-content"></p>
      </button>
      <div class="pinned-text-actions">
        <button class="action-btn pinned-mini-copy" title="Copy">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="9" y="9" width="13" height="13" rx="2"/>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
          </svg>
        </button>
        <button class="action-btn text-pin-btn active" title="Unpin">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 17v5M9 10.76V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v6.76a2 2 0 0 0 .55 1.38l1.6 1.68A1 1 0 0 1 17 15.5H7a1 1 0 0 1-.75-1.68l1.6-1.68A2 2 0 0 0 9 10.76z"/>
          </svg>
        </button>
        <button class="action-btn text-delete-btn" title="Delete">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="3 6 5 6 21 6"/>
            <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
            <path d="M10 11v6M14 11v6"/>
            <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
          </svg>
        </button>
      </div>
    </div>
  </template>

  <!-- Bookmark item template -->
  <template id="bookmarkTemplate">
    <div class="link-item" data-id="">
      <button class="link-body" title="Click to copy link">
        <svg class="link-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
          <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
        </svg>
        <span class="link-url"></span>
        <span class="text-copy-hint">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="9" y="9" width="13" height="13" rx="2"/>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
          </svg>
          Copy
        </span>
      </button>
      <div class="text-footer">
        <span class="text-time"></span>
        <div class="link-actions">
          <button class="action-btn link-pin-btn" title="Pin">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 17v5M9 10.76V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v6.76a2 2 0 0 0 .55 1.38l1.6 1.68A1 1 0 0 1 17 15.5H7a1 1 0 0 1-.75-1.68l1.6-1.68A2 2 0 0 0 9 10.76z"/>
            </svg>
          </button>
          <button class="action-btn link-open-btn" title="Open in new tab">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
              <polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>
            </svg>
          </button>
          <button class="action-btn link-delete-btn" title="Delete">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="3 6 5 6 21 6"/>
              <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
              <path d="M10 11v6M14 11v6"/>
              <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </template>

  <!-- Lightbox / preview -->
  <div class="lightbox" id="lightbox" aria-hidden="true">
    <div class="lightbox-backdrop" id="lightboxBackdrop"></div>
    <div class="lightbox-panel" role="dialog" aria-modal="true" aria-label="Screenshot preview">
      <div class="lightbox-bar">
        <span class="lightbox-time" id="lightboxTime"></span>
        <div class="lightbox-bar-actions">
          <button class="lightbox-btn" id="lightboxCopy" title="Copy to clipboard">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="9" y="9" width="13" height="13" rx="2"/>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
            </svg>
          </button>
          <button class="lightbox-btn" id="lightboxSave" title="Download image">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="7 10 12 15 17 10"/>
              <line x1="12" y1="15" x2="12" y2="3"/>
            </svg>
          </button>
          <button class="lightbox-btn lightbox-close" id="lightboxClose" title="Close">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>
      </div>
      <div class="lightbox-imgwrap">
        <img class="lightbox-img" id="lightboxImg" alt="Screenshot preview" />
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
